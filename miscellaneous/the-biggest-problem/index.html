	<script>
	(function() {
	  const root = document.documentElement;
	  const toggleBtn = document.getElementById("theme-toggle");
	  const icon = document.getElementById("theme-icon");

	  
	  const savedTheme = localStorage.getItem("theme");
	  const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
	  const current = savedTheme || (systemPrefersDark ? "dark" : "light");
	  root.setAttribute("data-theme", current);
	  setIcon(current);

	  
	  toggleBtn.addEventListener("click", () => {
		const newTheme = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
		const chromaLink = document.getElementById("chroma-theme");
		if (newTheme === "dark") {
		  chromaLink.href = "/css/syntax-dark.css";
		} else {
		  chromaLink.href = "/css/syntax-light.css";
		}
		root.setAttribute("data-theme", newTheme);
		localStorage.setItem("theme", newTheme);
		setIcon(newTheme);
	  });

	  
	  function setIcon(theme) {
		if (theme === "dark") {
		  icon.innerHTML = `
			<path d="M21 12.79A9 9 0 1 1 11.21 3
					 7 7 0 0 0 21 12.79z"></path>`;
		} else {
		  icon.innerHTML = `
			<circle cx="12" cy="12" r="5"></circle>
			<line x1="12" y1="1" x2="12" y2="3"></line>
			<line x1="12" y1="21" x2="12" y2="23"></line>
			<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
			<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
			<line x1="1" y1="12" x2="3" y2="12"></line>
			<line x1="21" y1="12" x2="23" y2="12"></line>
			<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
			<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
		}
	  }
	})();
	</script>
